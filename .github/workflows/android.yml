name: Build Android APK and test backend

on:
  push:
    paths: ["android/**", "trading-bot/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r trading-bot/requirements.txt httpx
      - run: cd trading-bot && pytest -q

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: forex-ai-bot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
